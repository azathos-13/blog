spring:
  datasource:
    url: jdbc:mysql://localhost:3306/数据库名?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: 用户名（root）
    password: 密码
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

# Flyway will run migration scripts in classpath:db/migration
flyway:
  enabled: true
  baseline-on-migrate: true
  locations: classpath:db/migration
