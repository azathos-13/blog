<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写文章 - 博客系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-light bg-light mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">博客系统</a>
            <div>
                <span class="navbar-text me-3" th:text="'欢迎，' + ${user.username}"></span>
                <a th:href="@{/logout}" class="btn btn-outline-secondary btn-sm">退出</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">发表新文章</h4>
                    </div>
                    <div class="card-body">
                        <!-- 错误消息 -->
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        
                        <form th:action="@{/articles/write}" method="post">
                            <!-- 文章标题 -->
                            <div class="mb-3">
                                <label for="title" class="form-label">文章标题</label>
                                <input type="text" class="form-control" id="title" name="title" 
                                       required maxlength="200" placeholder="请输入文章标题">
                            </div>
                            
                            <!-- 选择分区 -->
                            <div class="mb-3">
                                <label for="categoryId" class="form-label">选择分区</label>
                                <select class="form-select" id="categoryId" name="categoryId" required>
                                    <option value="">请选择文章分区</option>
                                    <option th:each="cat : ${categories}"
                                            th:value="${cat.id}"
                                            th:text="${cat.name}"></option>
                                </select>
                            </div>
                            
                            <!-- 文章内容 -->
                            <div class="mb-3">
                                <label for="content" class="form-label">文章内容</label>
                                <textarea class="form-control" id="content" name="content" 
                                          rows="15" required placeholder="请输入文章内容..."></textarea>
                                <div class="form-text">支持 Markdown 格式</div>
                            </div>
                            
                            <!-- 操作按钮 -->
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/articles}" class="btn btn-outline-secondary">
                                    取消
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    发表文章
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
