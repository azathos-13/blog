<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Home - Blog Skeleton</title>
</head>
<body>
  <h1>Welcome</h1>
  <p>Current user: <strong th:text="${username}">Visitor</strong></p>
  <p>Role: <strong th:text="${role}">NONE</strong></p>

  <div th:if="${role != 'NONE'}">
    <form th:action="@{/logout}" method="get">
      <button type="submit">Logout</button>
    </form>
  </div>

  <div th:if="${role == 'NONE'}">
    <a th:href="@{/login}">Login</a>
  </div>
</body>
</html>
