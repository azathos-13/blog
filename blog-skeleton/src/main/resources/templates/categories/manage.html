<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>分区管理 - 我的博客</title>
    <!-- 引入Bootstrap CSS (CDN方式，简单) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">

   
    <h2>📁 分区管理</h2>
    <p class="text-muted">此页面仅对管理员可见。</p>

    <!-- 显示操作成功或失败的提示信息 -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${message}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- 分区列表表格 -->
    <div class="card mt-4">
        <div class="card-header">
            现有分区列表
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>分区名称</th>
                    <th>描述</th>
                    <th>排序</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cat : ${categories}">
                    <td th:text="${cat.id}"></td>
                    <td th:text="${cat.name}"></td>
                    <td th:text="${cat.description}"></td>
                    <td th:text="${cat.sortOrder}"></td>
                    <td>
                        <!-- 删除按钮，点击会有确认提示 -->
                        <a th:href="@{/categories/delete/{id}(id=${cat.id})}"
                           class="btn btn-outline-danger btn-sm"
                           onclick="return confirm('确定要删除分区【' + $(this).closest('tr').find('td:nth-child(2)').text() + '】吗？此操作不可恢复！');">
                            删除
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 创建新分区的表单 -->
    <div class="card mt-4">
        <div class="card-header">
            创建新分区
        </div>
        <div class="card-body">
            <form th:action="@{/categories}" method="post" th:object="${newCategory}">
                <div class="mb-3">
                    <label for="name" class="form-label">分区名称 *</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}"
                           required placeholder="例如：技术杂谈">
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">分区描述</label>
                    <textarea class="form-control" id="description" th:field="*{description}"
                              rows="2" placeholder="可选的描述信息..."></textarea>
                </div>
                <div class="mb-3">
                    <label for="sortOrder" class="form-label">排序值</label>
                    <input type="number" class="form-control" id="sortOrder" th:field="*{sortOrder}"
                           placeholder="数字越小越靠前，默认0">
                </div>
                <button type="submit" class="btn btn-primary">创建分区</button>
            </form>
        </div>
    </div>

</div>
<!-- 引入 Bootstrap JS (用于关闭提示框) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- 引入 jQuery (用于删除确认提示中获取分区名) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</body>
</html>
