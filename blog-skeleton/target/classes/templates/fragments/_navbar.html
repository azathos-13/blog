<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- 导航栏片段 -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">博客系统</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/articles}">文章列表</a>
                    </li>
                    <li th:if="${user != null and user.role == 'ADMIN'}" class="nav-item">
                        <a class="nav-link active" th:href="@{/categories/manage}">分区管理</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span th:if="${user != null}" class="navbar-text me-3">
                        欢迎，<span th:text="${user.username}"></span>
                        <span class="badge bg-secondary ms-1" th:text="${user.role}"></span>
                    </span>
                    <span th:unless="${user != null}" class="navbar-text me-3">
                        游客身份访问
                    </span>
                    <div th:if="${user != null}">
                        <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">
                            退出登录
                        </a>
                    </div>
                    <div th:unless="${user != null}">
                        <a th:href="@{/login}" class="btn btn-outline-primary btn-sm me-2">登录</a>
                        <a th:href="@{/guest}" class="btn btn-outline-secondary btn-sm">游客访问</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>
