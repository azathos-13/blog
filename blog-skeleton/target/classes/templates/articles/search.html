<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'搜索：' + ${keyword} + ' - 博客系统'">搜索文章</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏（同list.html） -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">博客系统</a>
            <!-- 用户信息 -->
            <div th:if="${user != null}">
                <span class="navbar-text me-3" th:text="${user.username}"></span>
                <a th:href="@{/logout}" class="btn btn-outline-secondary btn-sm">退出</a>
            </div>
            <div th:unless="${user != null}">
                <a th:href="@{/login}" class="btn btn-outline-primary btn-sm me-2">登录</a>
                <a th:href="@{/guest}" class="btn btn-outline-secondary btn-sm">游客访问</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- 左侧分区列表 -->
            <div class="col-md-3">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">文章分区</h5>
                    </div>
                    <div class="card-body">
                        <div class="list-group">
                            <a th:href="@{/articles}" class="list-group-item list-group-item-action">
                                全部文章
                            </a>
                            <a th:each="cat : ${categories}"
                               th:href="@{/articles(categoryId=${cat.id})}"
                               class="list-group-item list-group-item-action">
                               <span th:text="${cat.name}"></span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧搜索结果 -->
            <div class="col-md-9">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="bi bi-search"></i> 搜索结果
                            <small class="text-muted" th:text="'关键词：' + ${keyword}"></small>
                        </h5>
                    </div>
                    <div class="card-body">
                        <!-- 搜索结果数量 -->
                        <div class="alert alert-info" th:if="${#lists.isEmpty(articles)}">
                            没有找到包含 "<span th:text="${keyword}"></span>" 的文章
                        </div>
                        <div class="alert alert-info" th:unless="${#lists.isEmpty(articles)}">
                            找到 <span th:text="${#lists.size(articles)}"></span> 篇包含 "<span th:text="${keyword}"></span>" 的文章
                        </div>
                        
                        <!-- 搜索结果列表 -->
                        <div th:each="article : ${articles}" class="mb-4 pb-3 border-bottom">
                            <h5>
                                <a th:href="@{/articles/{id}(id=${article.id})}" 
                                   class="text-decoration-none" th:text="${article.title}"></a>
                            </h5>
                            <div class="text-muted small mb-2">
                                <i class="bi bi-person"></i>
                                <span th:text="${article.creator.username}"></span>
                                &nbsp;•&nbsp;
                                <i class="bi bi-calendar"></i>
                                <span th:text="${#dates.format(article.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                                &nbsp;•&nbsp;
                                <i class="bi bi-folder"></i>
                                <span th:text="${article.category.name}"></span>
                            </div>
                            <p class="mb-2" th:text="${#strings.substring(article.content, 0, 150)} + '...'"></p>
                            <a th:href="@{/articles/{id}(id=${article.id})}" class="btn btn-sm btn-outline-primary">
                                阅读全文 <i class="bi bi-arrow-right"></i>
                            </a>
                        </div>
                        
                        <!-- 返回按钮 -->
                        <div class="mt-4">
                            <a th:href="@{/articles}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> 返回文章列表
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
