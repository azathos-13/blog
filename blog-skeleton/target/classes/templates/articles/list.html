<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章列表 - 博客系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">博客系统</a>
            <div class="d-flex">
                <span th:if="${user != null}" class="navbar-text me-3">
                    <span th:text="${user.username}"></span>
                    <span th:if="${isAdmin}" class="badge bg-danger">ADMIN</span>
                    <span th:if="${isGuest}" class="badge bg-success">GUEST</span>
                </span>
                <a th:href="@{/logout}" class="btn btn-outline-secondary btn-sm">退出</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- 左侧分区列表 -->
            <div class="col-md-3">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">文章分区</h5>
                    </div>
                    <div class="card-body">
                        <div class="list-group">
                            <a th:href="@{/articles}" 
                               th:classappend="${currentCategory == null} ? 'active' : ''"
                               class="list-group-item list-group-item-action">
                                全部文章
                            </a>
                            <a th:each="cat : ${categories}"
                               th:href="@{/articles(categoryId=${cat.id})}"
                               th:classappend="${currentCategory != null and currentCategory.id == cat.id} ? 'active' : ''"
                               class="list-group-item list-group-item-action">
                               <span th:text="${cat.name}"></span>
                               <span class="badge bg-secondary float-end" th:text="0"></span>
                            </a>
                        </div>
                    </div>
                    <!-- 写文章按钮（嘉宾和管理员可见） -->
                    <div th:if="${isAdmin or isGuest}" class="card-footer">
                        <a th:href="@{/articles/write}" class="btn btn-primary w-100">
                            <i class="bi bi-pencil"></i> 写文章
                        </a>
                    </div>
                </div>
            </div>

            <!-- 右侧文章列表 -->
            <div class="col-md-9">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <span th:if="${currentCategory}" th:text="'分区：' + ${currentCategory.name}"></span>
                            <span th:unless="${currentCategory}">全部文章</span>
                        </h5>
                        <!-- 搜索框 -->
                        <form th:action="@{/articles/search}" method="get" class="d-flex">
                            <input type="text" name="keyword" class="form-control form-control-sm me-2" 
                                   placeholder="搜索文章..." required>
                            <button type="submit" class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-search"></i>
                            </button>
                        </form>
                    </div>
                    <div class="card-body">
                        <!-- 文章列表 -->
                        <div th:each="article : ${articles}" class="mb-4 pb-3 border-bottom">
                            <h5>
                                <a th:href="@{/articles/{id}(id=${article.id})}" 
                                   class="text-decoration-none" th:text="${article.title}"></a>
                            </h5>
                            <div class="text-muted small mb-2">
                                <i class="bi bi-person"></i>
                                <span th:text="${article.creator.username}"></span>
                                &nbsp;•&nbsp;
                                <i class="bi bi-calendar"></i>
                                <!-- 修复：日期格式化 -->
                                <span th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                                &nbsp;•&nbsp;
                                <i class="bi bi-folder"></i>
                                <span th:text="${article.category.name}"></span>
                            </div>
                            <!-- 修复：内容截取，防止索引越界 -->
                            <p class="mb-2" th:text="${#strings.length(article.content) > 150 ? #strings.substring(article.content, 0, 150) + '...' : article.content}"></p>
                            <a th:href="@{/articles/{id}(id=${article.id})}" class="btn btn-sm btn-outline-primary">
                                阅读全文 <i class="bi bi-arrow-right"></i>
                            </a>
                            <!-- 删除按钮（仅管理员可见） -->
                            <a th:if="${isAdmin}" 
                               th:href="@{/articles/delete/{id}(id=${article.id})}"
                               class="btn btn-sm btn-outline-danger ms-2"
                               onclick="return confirm('确定要删除这篇文章吗？')">
                                <i class="bi bi-trash"></i> 删除
                            </a>
                        </div>
                        
                        <!-- 分页 -->
                        <div th:if="${totalPages > 1}" class="mt-4">
                            <nav aria-label="文章分页">
                                <ul class="pagination justify-content-center">
                                    <li th:classappend="${currentPage == 0} ? 'disabled' : ''" class="page-item">
                                        <a th:href="@{/articles(categoryId=${currentCategory != null ? currentCategory.id : ''}, page=${currentPage - 1})}"
                                           class="page-link">上一页</a>
                                    </li>
                                    <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                        th:classappend="${i == currentPage} ? 'active' : ''" 
                                        class="page-item">
                                        <a th:href="@{/articles(categoryId=${currentCategory != null ? currentCategory.id : ''}, page=${i})}"
                                           class="page-link" th:text="${i + 1}"></a>
                                    </li>
                                    <li th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''" class="page-item">
                                        <a th:href="@{/articles(categoryId=${currentCategory != null ? currentCategory.id : ''}, page=${currentPage + 1})}"
                                           class="page-link">下一页</a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                        
                        <!-- 没有文章时的提示 -->
                        <div th:if="${#lists.isEmpty(articles)}" class="text-center py-5">
                            <i class="bi bi-journal-text display-1 text-muted"></i>
                            <h5 class="mt-3 text-muted">暂无文章</h5>
                            <p th:if="${isAdmin or isGuest}" class="text-muted">
                                点击左侧"写文章"按钮发表您的第一篇文章
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
